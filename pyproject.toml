[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evryn"
version = "1.0.0"
description = "EVRYN : Unified Scientific Knowledge Discovery Platform"
authors = [{ name = "EVRYN Team" }]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "networkx",
    "requests",
    "tqdm",
    "rich",
    "pillow",
]

[project.urls]
Homepage = "https://tzykv1n.github.io/evryn"
Repository = "https://github.com/tzykv1n/evryn"
Issues = "https://github.com/tzykv1n/evryn/issues"

[project.scripts]
evryn = "evryn.cli:main"
